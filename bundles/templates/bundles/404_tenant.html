<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duka Halikupatikana - Bando SaaS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(22, 28, 45, 0.7);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --secondary: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-main: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background-image: radial-gradient(circle at center, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 3rem 2rem;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 30px;
            z-index: -1;
            opacity: 0.15;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: var(--primary);
            font-size: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .subdomain-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-family: monospace;
            color: var(--primary);
            font-size: 0.95rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin: 0.5rem 0 1.5rem 0;
            display: inline-block;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 5px 20px var(--primary-glow);
            transition: all 0.3s ease;
            justify-content: center;
            font-size: 1.05rem;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            justify-content: center;
            font-size: 1.05rem;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-store-slash"></i>
        </div>
        <h1>Duka Halikupatikana</h1>
        <div>
            <span class="subdomain-tag">{{ subdomain }}.{{ main_host }}</span>
        </div>
        
        <p>Tovuti ya duka lenye jina la <strong>{{ subdomain }}</strong> haijasajiliwa bado kwenye mfumo wetu. Ikiwa wewe ni mmiliki au unataka kuanzisha duka jipya la mabando ya bei nafuu kwa kutumia jina hili, unaweza kujiunga sasa!</p>

        <div class="btn-group">
            <a href="https://wa.me/255620123456?text=Habari! Nataka kusajili duka la mabando lenye subdomain ya {{ subdomain }}." target="_blank" class="primary-btn">
                <i class="fa-solid fa-plus"></i> Sajili Duka Hili Leo
            </a>
            
            <a href="//{{ main_host }}/" class="secondary-btn" id="home-link">
                <i class="fa-solid fa-house"></i> Rudi Tovuti Kuu
            </a>
        </div>
    </div>

    <script>
        // Update subdomain tag with actual browser location host
        document.addEventListener("DOMContentLoaded", function() {
            const host = window.location.host;
            const tag = document.querySelector(".subdomain-tag");
            if (tag) {
                tag.innerText = host;
            }
        });
    </script>
</body>
</html>
